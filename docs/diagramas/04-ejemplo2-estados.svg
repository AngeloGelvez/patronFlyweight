<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 400" width="1560" height="400" font-family="Inter, Segoe UI, Arial, sans-serif"><title>Ejemplo 2 · Diagrama de estados</title><rect width="1560" height="400" fill="#ffffff"/><defs>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/></marker>
