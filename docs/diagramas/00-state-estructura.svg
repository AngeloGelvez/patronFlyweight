<text x="560" y="120" text-anchor="middle" font-size="13" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">estado actual</text>
<path d="M590.0,330 L590.0,280 L780.0,280 L780.0,159" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#tri)"/>
