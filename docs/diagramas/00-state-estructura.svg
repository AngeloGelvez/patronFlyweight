<text x="72" y="147" font-size="14" fill="#0f172a" font-family="monospace">+operacion()</text>
<text x="72" y="168" font-size="14" fill="#0f172a" font-family="monospace">+cambiarEstado(nuevo: Estado)</text>
<rect x="640" y="60" width="400" height="99" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
