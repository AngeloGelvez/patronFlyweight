<path d="M740,385 L1000,385" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="870" y="375" text-anchor="middle" font-size="13" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">cambiarEstado(...)</text>
<rect x="60" y="260" width="420" height="81" rx="6" fill="#fffbeb" stroke="#b45309" stroke-dasharray="5 4"/>
<text x="72" y="284" font-size="14" fill="#0f172a" font-family="monospace">operacion() {</text>
<text x="72" y="305" font-size="14" fill="#0f172a" font-family="monospace">  this.estado.operacion(this);</text>
<text x="72" y="326" font-size="14" fill="#0f172a" font-family="monospace">}  // delega en el estado actual</text>
