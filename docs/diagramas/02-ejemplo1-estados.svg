<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 250" width="1500" height="250" font-family="Inter, Segoe UI, Arial, sans-serif"><title>Ejemplo 1 · Diagrama de estados</title><rect width="1500" height="250" fill="#ffffff"/><defs>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/></marker>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#334155" stroke-width="1.8"/></marker>
<marker id="dia" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="17" markerHeight="13" orient="auto"><path d="M1,6 L8,1 L15,6 L8,11 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/></marker>
</defs>
<rect x="100" y="90" width="190" height="56" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
<text x="195.0" y="124.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Disponible</text>
<rect x="450" y="90" width="190" height="56" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
<text x="545.0" y="124.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Reservada</text>
<rect x="800" y="90" width="190" height="56" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
<text x="895.0" y="124.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Pagada</text>
<rect x="1145" y="85" width="200" height="66" rx="16" fill="none" stroke="#64748b" stroke-width="1.8"/>
<rect x="1150" y="90" width="190" height="56" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
<text x="1245.0" y="124.0" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Usada</text>
<circle cx="45" cy="118" r="9" fill="#0f172a"/>
<path d="M54,118 L100,118" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#open)"/>
<path d="M290,106 L450,106" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#open)"/>
<text x="370" y="96" text-anchor="middle" font-size="13" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">reservar</text>
<path d="M450,134 L290,134" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#open)"/>
<text x="370" y="156" text-anchor="middle" font-size="13" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">cancelar</text>
<path d="M640,118 L800,118" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#open)"/>
<text x="720" y="108" text-anchor="middle" font-size="13" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">pagar</text>
<path d="M990,118 L1150,118" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#open)"/>
<text x="1070" y="108" text-anchor="middle" font-size="13" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">entrar</text>
<text x="750" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">Las acciones que no aparecen como flecha se rechazan y la entrada se queda en el mismo estado.</text>
</svg>