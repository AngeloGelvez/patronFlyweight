<text x="612" y="231" font-size="14" fill="#0f172a" font-family="monospace">#rechazar(accion): Resultado</text>
<rect x="1190" y="40" width="330" height="120" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
